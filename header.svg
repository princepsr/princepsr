<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="Blueprint titled Prince Singh, backend engineer. A request flows from client to API to service to database. Title block reads: Java, backend systems, shipped products.">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #dbeafe; }
    .grid { stroke: #ffffff; stroke-opacity: .07; }
    .ln { stroke: #dbeafe; stroke-width: 2; fill: none; }
    .box { stroke: #dbeafe; stroke-width: 2; fill: #0e4a86; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s ease forwards; }
    .b1{animation-delay:.2s}.b2{animation-delay:.7s}.b3{animation-delay:1.2s}.b4{animation-delay:1.7s}
    .pipe { stroke: #7dd3fc; stroke-width: 2; stroke-dasharray: 6 6; fill: none; opacity: 0; animation: fade .4s forwards, flow 1s linear infinite; }
    .p1{animation-delay:.9s,.9s}.p2{animation-delay:1.4s,1.4s}.p3{animation-delay:1.9s,1.9s}
    .lbl { font-size: 14px; text-anchor: middle; font-weight: 700; opacity: 0; animation: fade .4s forwards; }
    .t1{animation-delay:.6s}.t2{animation-delay:1.1s}.t3{animation-delay:1.6s}.t4{animation-delay:2.1s}
    .name { font-size: 40px; font-weight: 700; letter-spacing: 3px; fill: #fff; opacity: 0; animation: fade .6s 2.3s forwards; }
    .sub { font-size: 15px; letter-spacing: 2px; fill: #7dd3fc; opacity: 0; animation: fade .6s 2.6s forwards; }
    .tb { font-size: 11px; fill: #93c5fd; }
    .tv { font-size: 13px; font-weight: 700; }
    .sheet { opacity: 0; animation: fade .6s 2.9s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; stroke-dashoffset: 0 !important; }
    }
  </style>
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" class="grid" fill="none"/></pattern>
    <pattern id="G" width="150" height="150" patternUnits="userSpaceOnUse"><path d="M150 0H0V150" stroke="#fff" stroke-opacity=".14" fill="none"/></pattern>
  </defs>
  <rect width="900" height="340" rx="10" fill="#0b3a6b"/>
  <rect width="900" height="340" rx="10" fill="url(#g)"/>
  <rect width="900" height="340" rx="10" fill="url(#G)"/>
  <rect x="12" y="12" width="876" height="316" class="ln" style="stroke-width:1.5"/>

  <!-- schematic: request flows through the system -->
  <rect class="box b1" x="40" y="48" width="140" height="58" rx="4"/>
  <rect class="box b2" x="250" y="48" width="140" height="58" rx="4"/>
  <rect class="box b3" x="460" y="48" width="140" height="58" rx="4"/>
  <rect class="box b4" x="670" y="48" width="140" height="58" rx="4"/>
  <text class="lbl t1" x="110" y="83">CLIENT</text>
  <text class="lbl t2" x="320" y="83">API</text>
  <text class="lbl t3" x="530" y="83">SERVICE</text>
  <text class="lbl t4" x="740" y="83">DATABASE</text>
  <path class="pipe p1" d="M180 77H250"/><path class="pipe p2" d="M390 77H460"/><path class="pipe p3" d="M600 77H670"/>

  <text class="name" x="40" y="182">PRINCE SINGH</text>
  <text class="sub" x="42" y="214">SOFTWARE ENGINEER II  ·  JAVA  ·  DISTRIBUTED SYSTEMS  ·  AI</text>

  <!-- title block -->
  <g class="sheet">
    <rect x="40" y="244" width="820" height="62" class="ln" style="stroke-width:1.5"/>
    <path d="M250 244V306M460 244V306M670 244V306M40 275H860" class="ln" style="stroke-width:1"/>
    <text class="tb" x="50" y="260">DRAWN BY</text><text class="tv" x="50" y="295">PRINCE SINGH</text>
    <text class="tb" x="260" y="260">ROLE</text><text class="tv" x="260" y="295">SOFTWARE ENGINEER II</text>
    <text class="tb" x="470" y="260">STACK</text><text class="tv" x="470" y="295">JAVA · SPRING BOOT · AI</text>
    <text class="tb" x="680" y="260">SHEET</text><text class="tv" x="680" y="295">01 OF 01</text>
  </g>
</svg>
